services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: homelab-crowdsec
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Collection auto-installed on first start (Traefik access-log parser + scenarios)
      - COLLECTIONS=crowdsecurity/traefik
      # Pre-shared key registered as a bouncer named "traefik" in LAPI on first boot.
      # The Traefik bouncer plugin authenticates to LAPI with this same key.
      - BOUNCER_KEY_TRAEFIK=${CROWDSEC_BOUNCER_KEY}
    volumes:
      - /Volumes/homelab_data/homelab/data/crowdsec:/var/lib/crowdsec/data
      # Read Traefik access logs (edge detection source)
      - /Volumes/homelab_data/homelab/data/traefik:/var/log/traefik:ro
      - ./config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "cscli", "capi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Lightweight stats API for Homarr dashboard integration.
  # Queries CrowdSec LAPI, caches aggregated decision counts (60s TTL),
  # serves a tiny JSON payload on /stats. No external deps — stdlib only.
  stats-api:
    image: python:3.12.11-alpine3.22
    container_name: homelab-crowdsec-stats-api
    restart: unless-stopped
    environment:
      - CROWDSEC_LAPI_HOST=homelab-crowdsec:8080
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}
      - CACHE_TTL=60
      - PORT=8088
    volumes:
      - ./stats-api.py:/app/stats-api.py:ro
    command: ["python", "/app/stats-api.py"]
    networks:
      - homelab
